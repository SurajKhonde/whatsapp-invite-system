services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: invite-api-dev
    command: pnpm dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src              # live-mount source code
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - /app/node_modules           # keep container's node_modules
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: invite-worker-dev
    command: pnpm worker
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: invite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: invite-redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_data: