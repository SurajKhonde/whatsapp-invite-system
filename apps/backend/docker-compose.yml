services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invite-api
    restart: unless-stopped
    ports:
      - 5000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    mem_limit: 500m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: invite-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    mem_limit: 700m

  postgres:
    image: postgres:16
    container_name: invite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 500m

  redis:
    image: redis:7
    container_name: invite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 200m
  nginx:
    image: nginx:stable-alpine
    container_name: invite-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
volumes:
  postgres_data: