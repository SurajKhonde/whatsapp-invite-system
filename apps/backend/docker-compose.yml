services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invite-migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invite-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    mem_limit: 500m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: invite-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    mem_limit: 700m

  postgres:
    image: postgres:16
    container_name: invite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 500m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: invite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 200m

volumes:
  postgres_data: