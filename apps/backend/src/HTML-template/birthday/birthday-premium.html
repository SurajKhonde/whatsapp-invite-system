<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    margin: 0;
    padding: 0;
  }

  .card {
    width: 800px;
    height: 1100px;
    position: relative;
    font-family: "Segoe UI", sans-serif;
    color: white;
    overflow: hidden;
    border-radius: 30px;

    /* 🔥 MAIN BACKGROUND */
    background: url("{{bgImage}}") center/cover no-repeat;
  }

  /* dark overlay for readability */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
  }

  /* golden border */
  .border {
    position: absolute;
    inset: 20px;
    border: 2px solid rgba(255,215,0,0.7);
    border-radius: 20px;
  }

  /* top ribbon */
  .ribbon {
    position: absolute;
    top: 0;
    right: 0;
    width: 250px;
  }

  /* title */
  .title {
    position: absolute;
    top: 120px;
    width: 100%;
    text-align: center;
    font-size: 60px;
    font-weight: bold;
    color: #ffd700;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,215,0,0.7);
  }

  .subtitle {
    position: absolute;
    top: 200px;
    width: 100%;
    text-align: center;
    font-size: 24px;
  }

  /* balloons image */
  .balloons {
    position: absolute;
    top: 260px;
    width: 100%;
    text-align: center;
  }

  .balloons img {
    width: 300px;
  }

  /* name */
  .name {
    position: absolute;
    top: 450px;
    width: 100%;
    text-align: center;
    font-size: 70px;
    font-weight: 600;
    font-family: cursive;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  /* details box */
  .details {
    position: absolute;
    top: 600px;
    width: 100%;
    text-align: center;
  }

  .box {
    display: inline-block;
    padding: 25px 50px;
    border-radius: 20px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
  }

  .item {
    font-size: 22px;
    margin: 10px 0;
  }

  /* candles */
  .candles {
    position: absolute;
    bottom: 120px;
    width: 100%;
    text-align: center;
  }

  .candles img {
    width: 200px;
  }

  /* footer */
  .footer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    opacity: 0.8;
  }

</style>
</head>

<body>
  <div class="card">

    <div class="overlay"></div>
    <div class="border"></div>

    <!-- Ribbon -->
    <img src="{{ribbonImage}}" class="ribbon" />

    <!-- Title -->
    <div class="title">HAPPY BIRTHDAY</div>
    <div class="subtitle">You're Invited 🎉</div>

    <!-- Balloons -->
    <div class="balloons">
      <img src="{{balloonImage}}" />
    </div>

    <!-- Name -->
    <div class="name">{{name}}</div>

    <!-- Details -->
    <div class="details">
      <div class="box">
        <div class="item">📅 {{date}}</div>
        <div class="item">⏰ {{time}}</div>
        <div class="item">📍 {{venue}}</div>
      </div>
    </div>

    <!-- Candles -->
    <div class="candles">
      <img src="{{candleImage}}" />
    </div>

    <!-- Footer -->
    <div class="footer">
      Made with ❤️ using InviteFlow
    </div>

  </div>
</body>
</html>
