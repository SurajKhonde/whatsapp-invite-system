<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:800px; height:1100px;
  background:#fdf6f0;
  font-family:'Montserrat',sans-serif;
}

.card {
  width:800px; height:1100px;
  position:relative; overflow:hidden;
  background: linear-gradient(160deg, #fdf6f0 0%, #fceee4 40%, #fdf0e8 100%);
}

/* ── DAMASK WATERMARK PATTERN ── */
.damask {
  position:absolute; inset:0; opacity:0.06;
  background-image: radial-gradient(ellipse at 25% 25%, #8B4513 1px, transparent 1px),
    radial-gradient(ellipse at 75% 75%, #8B4513 1px, transparent 1px),
    radial-gradient(ellipse at 50% 50%, #8B4513 0.5px, transparent 0.5px);
  background-size: 60px 60px, 60px 60px, 30px 30px;
}

/* ── OUTER BORDER ── */
.border-outer {
  position:absolute; inset:12px;
  border:2px solid rgba(180,120,60,0.4);
}
.border-inner {
  position:absolute; inset:20px;
  border:1px solid rgba(180,120,60,0.2);
}

/* ── CORNER PIECES ── */
.corner { position:absolute; width:80px; height:80px; }
.corner.tl { top:6px; left:6px; }
.corner.tr { top:6px; right:6px; transform:scaleX(-1); }
.corner.bl { bottom:6px; left:6px; transform:scaleY(-1); }
.corner.br { bottom:6px; right:6px; transform:scale(-1,-1); }

/* ── SAVE THE DATE HEADER ── */
.header {
  position:absolute; top:32px; width:100%; text-align:center;
}
.save-the {
  font-family:'Cormorant Garamond',serif;
  font-size:28px; font-weight:300;
  color:#5a3825; letter-spacing:10px;
  text-transform:uppercase; display:block;
  margin-bottom:-4px;
}
.date-script {
  font-family:'Pinyon Script',cursive;
  font-size:72px; color:#8B4513;
  line-height:1; display:block;
  text-shadow: 1px 1px 0 rgba(139,69,19,0.2);
}
.header-line {
  width:320px; height:1px; margin:6px auto 0;
  background:linear-gradient(90deg,transparent,rgba(139,69,19,0.5),transparent);
}

/* ── MANDAP ARCH ── */
.mandap-area {
  position:absolute; top:155px; left:50%; transform:translateX(-50%);
  width:540px; height:360px;
}

/* ── COUPLE NAMES ABOVE ILLUSTRATION ── */
.names-above {
  position:absolute; top:160px; width:100%; text-align:center;
}
.groom-name-top {
  font-family:'Pinyon Script',cursive;
  font-size:38px; color:#5a3825;
  display:inline-block;
}
.ampersand {
  font-family:'Pinyon Script',cursive;
  font-size:50px; color:#c0703a;
  display:inline-block; margin:0 8px; line-height:1;
  vertical-align:middle;
}
.bride-name-top {
  font-family:'Pinyon Script',cursive;
  font-size:38px; color:#5a3825;
  display:inline-block;
}

/* ── DETAILS RIBBON ── */
.ribbon-section {
  position:absolute; bottom:220px; left:50%; transform:translateX(-50%);
  width:640px; text-align:center;
}
.ribbon-bg {
  background:linear-gradient(135deg,rgba(139,69,19,0.08),rgba(192,112,58,0.12),rgba(139,69,19,0.08));
  border:1px solid rgba(139,69,19,0.3);
  border-radius:2px; padding:16px 28px;
  position:relative;
}
.ribbon-bg::before, .ribbon-bg::after {
  content:''; position:absolute; top:50%; width:18px; height:40px;
  background:rgba(139,69,19,0.15); transform:translateY(-50%);
  clip-path:polygon(0 0,100% 20%,100% 80%,0 100%);
}
.ribbon-bg::before { left:-18px; }
.ribbon-bg::after { right:-18px; transform:translateY(-50%) scaleX(-1); }

.detail-row { display:flex; justify-content:center; align-items:center; gap:24px; margin:5px 0; }
.detail-icon { font-size:16px; }
.detail-text {
  font-family:'Cormorant Garamond',serif;
  font-size:17px; color:#5a3825; letter-spacing:1px;
}
.detail-label {
  font-family:'Montserrat',sans-serif;
  font-size:9px; color:rgba(90,56,37,0.6);
  letter-spacing:3px; text-transform:uppercase;
  display:block; margin-bottom:2px;
}
.divider-dot { color:rgba(139,69,19,0.4); font-size:20px; line-height:1; }

/* ── VENUE BOX ── */
.venue-section {
  position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
  width:580px; text-align:center;
}
.venue-label {
  font-family:'Montserrat',sans-serif;
  font-size:9px; letter-spacing:4px; color:rgba(90,56,37,0.5);
  text-transform:uppercase; margin-bottom:6px;
}
.venue-name {
  font-family:'Cormorant Garamond',serif;
  font-size:22px; font-weight:600; color:#5a3825;
  letter-spacing:1px; display:block;
}
.venue-addr {
  font-family:'Cormorant Garamond',serif;
  font-size:15px; color:rgba(90,56,37,0.7);
  font-style:italic; margin-top:3px;
}
.venue-line {
  width:200px; height:1px; margin:8px auto;
  background:linear-gradient(90deg,transparent,rgba(139,69,19,0.35),transparent);
}

/* ── FOOTER ── */
.footer {
  position:absolute; bottom:28px; width:100%; text-align:center;
}
.footer-text {
  font-family:'Montserrat',sans-serif;
  font-size:9px; letter-spacing:3px; color:rgba(139,69,19,0.4);
  text-transform:uppercase;
}
</style>
</head>
