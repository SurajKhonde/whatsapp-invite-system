<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e8c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1744;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff88cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5252;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadowFilter">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" flood-color="#e91e8c"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="128" cy="128" r="125" fill="#e91e8c" opacity="0.15"/>
  
  <!-- Main background with gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" filter="url(#shadowFilter)"/>
  
  <!-- Glossy overlay for depth -->
  <ellipse cx="128" cy="90" rx="90" ry="50" fill="white" opacity="0.15"/>
  
  <!-- Premium border ring -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#ff88cc" stroke-width="1.5" opacity="0.4"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Inner dark circle for contrast -->
  <circle cx="128" cy="128" r="100" fill="#0d0810" opacity="0.6"/>
  
  <!-- Accent glow ring inside -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.7"/>
  
  <!-- Telugu script "పి" - larger and more prominent -->
  <g filter="url(#innerGlow)">
    <text x="128" y="150" font-family="'Playfair Display', 'Georgia', serif" font-size="110" font-weight="900" fill="#ff88cc" text-anchor="middle" dominant-baseline="middle" letter-spacing="-3">
      పి
    </text>
  </g>
  
  <!-- Subtle glow circle around text -->
  <circle cx="128" cy="145" r="75" fill="none" stroke="#e91e8c" stroke-width="1" opacity="0.25"/>
  
  <!-- Bottom shine effect -->
  <ellipse cx="128" cy="165" rx="60" ry="15" fill="white" opacity="0.08"/>
</svg>